services:
  - type: web
    name: recoveriq-backend
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: OPENAI_API_KEY
        sync: false
